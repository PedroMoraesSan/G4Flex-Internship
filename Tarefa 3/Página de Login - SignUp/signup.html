<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página de Login / SignUp</title>
  <!-- CSS Link -->
  <link rel="stylesheet" href="signup.css" />
</head>
<body>
  <div class="login_form">
    <!-- Login form container -->
    <form id="loginForm">
      <h3>Sign Up in with</h3>
      <div class="login_option">
        <!-- Google button -->
        <div class="option">
          <a>
            <span>Google</span>
          </a>
        </div>
        <!-- Apple button -->
        <div class="option">
          <a href="#">
            <span>Apple</span>
          </a>
        </div>
      </div>
      <!-- Login option separator -->
      <p class="separator">
        <span>Or</span>
      </p>
      <!-- Email input box --> 
      <div class="input_box">
        <label for="email">Email</label>
        <input type="email" id="email_holder" placeholder="Enter email address"/>
      </div>
      <!-- Password input box -->
      <div class="input_box">
        <div class="password_title">
          <label for="password">Password</label>
          <a href="#">Forgot Password?</a>
        </div>
        <input type="password" id="password_holder" placeholder="Enter your password" />
      </div>
       <!-- Sign Up button -->
      <button id="signUpButton" type="submit" onclick="check(); return false">Sign Up</button>
      <p class="sign_up">Don't have an account? <a href="#">Sign up</a></p>
    </form>
  </div>
  <div id="result"></div>
  <!-- JavaScript-->
  <script src="signup.js"></script>
</body>
</html>
